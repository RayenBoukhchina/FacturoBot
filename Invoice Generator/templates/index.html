<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FacturoBot - Générateur de factures IA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
</head>
<body>
    <div class="container-fluid bg-light min-vh-100">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 bg-white shadow-sm sidebar">
                <div class="d-flex flex-column p-3" style="height: 100vh;">
                    <a href="/" class="d-flex align-items-center mb-3 mb-md-0 me-md-auto text-decoration-none">
                        <span class="fs-4 text-success fw-bold">FacturoBot</span>
                    </a>
                    <hr>
                    <ul class="nav nav-pills flex-column mb-auto">
                        <li class="nav-item">
                            <a href="/" class="nav-link active">
                                <i class="bi bi-house-door me-2"></i> Accueil
                            </a>
                        </li>
                        <li>
                            <a href="/history" class="nav-link link-dark">
                                <i class="bi bi-clock-history me-2"></i> Historique
                            </a>
                        </li>
                    </ul>
                    <hr>
                    <div class="text-center text-muted small">
                        INSAT Junior © 2025
                    </div>
                </div>
            </div>

            <!-- Main content -->
            <div class="col-md-9 col-lg-10 ms-sm-auto px-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
                    <h1 class="h2">Générateur de factures IA</h1>
                </div>

                <div class="card border-0 shadow-sm mb-4">
                    <div class="card-body p-4">
                        <form id="invoice-form">
                            <div class="mb-4">
                                <label for="description" class="form-label fw-bold">Décrivez votre facture naturellement :</label>
                                <div class="input-group">
                                    <textarea class="form-control" id="description" rows="5" 
                                        placeholder="Exemple: Facture pour client XYZ, adresse centre ville, matricule 12345/A, 2 ordinateurs à 1000 DT, 1 souris à 50 DT" required></textarea>
                                    <button type="button" class="btn btn-outline-success" id="voice-input-btn">
                                        <i class="bi bi-mic-fill"></i>
                                    </button>
                                </div>
                                <small class="form-text text-muted mt-2">Cliquez sur le microphone pour utiliser la dictée vocale.</small>
                            </div>
                            <button type="submit" class="btn btn-success px-4 py-2" id="generate-btn">
                                <span class="spinner-border spinner-border-sm d-none" id="spinner"></span>
                                Analyser
                            </button>
                        </form>
                    </div>
                </div>
                
                <!-- Aperçu de la facture -->
                <div id="invoice-preview" class="card border-0 shadow-sm mb-4 d-none">
                    <div class="card-header bg-white border-0 py-3">
                        <h4 class="mb-0">Aperçu de la facture</h4>
                    </div>
                    <div class="card-body p-4">
                        <div id="preview-content"></div>
                    </div>
                </div>
                
                <!-- Messages -->
                <div id="success-message" class="alert alert-success d-flex align-items-center d-none">
                    <i class="bi bi-check-circle-fill me-2"></i>
                    <div>
                        Facture générée avec succès!
                        <a id="download-link" href="#" class="btn btn-sm btn-primary ms-2">Télécharger</a>
                    </div>
                </div>
                
                <div id="error-message" class="alert alert-danger d-flex align-items-center d-none">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>
                    <div id="error-text"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
